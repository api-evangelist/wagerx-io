method: derived
source: openapi/wagerx-io-openapi.yml + well-known/wagerx-io-wagie-manifest.json (MCP tool inventory) + mcp/wagerx-io-tech-mcp-tools.json
summary: >-
  Binds each Wagie MCP tool to the public REST operation that exposes the same data. The REST surface is a
  thin read-only projection (6 data operations); most MCP tools are semantic views over two of them
  (getAllCasinoAudits, getCasinoAudit) and several have no REST twin at all. The live Wagie tools/list was
  503 at probe time, so bindings are by name and by the inputSchemas the provider publishes in its own
  manifest — confidence is set accordingly. The Tech Concierge tools have no REST surface in the spec.
surfaces:
  openapi: openapi/wagerx-io-openapi.yml (14 operations, 6 of them data reads; servers https://wagerx.io; no auth)
  mcp: https://wagerx.io/mcp (12 tools; tools/list 503 circuit-open at probe; schemas from /.well-known/wagie-manifest.json)
  mcp_tech: https://wagerx.io/tech/mcp (9 tools; tools/list 200, live)
  graphql: none
crosswalk:
- tool: check_casino
  category: casino-audit
  rest: [getCasinoAudit]
  binding: name -> slug (fuzzy alias match on the MCP side; REST requires the exact slug from getAllCasinoAudits)
  confidence: high
- tool: list_casinos
  category: casino-discovery
  rest: [getAllCasinoAudits]
  binding: full list, trust score + status projection
  confidence: high
- tool: top_casinos
  category: casino-discovery
  rest: [getAllCasinoAudits]
  binding: getAllCasinoAudits is already sorted by trust score desc; tool adds limit (1-25) and the completed-live-test filter
  confidence: medium
- tool: latest_audits
  category: casino-discovery
  rest: [getAllCasinoAudits]
  binding: same source re-sorted by audit date; REST offers no date sort or limit parameter
  confidence: medium
- tool: new_casinos
  category: casino-discovery
  rest: [getAllCasinoAudits]
  binding: filter on status/tag (mid-audit entries); REST has no filter parameter
  confidence: low
- tool: long_running_casinos
  category: casino-discovery
  rest: [getAllCasinoAudits]
  binding: needs a launch-year field not visible in the getAllCasinoAudits response schema; may draw on data the REST list omits
  confidence: low
- tool: compare_casinos
  category: casino-comparison
  rest: [getCasinoAudit]
  binding: composite — N calls to getCasinoAudit (2-5 slugs) merged client-side
  confidence: medium
- tool: regulatory_intelligence
  category: regulatory
  rest: [getRegulatoryIntel]
  binding: >-
    getRegulatoryIntel returns the global alert feed only (no jurisdiction parameter); the tool adds
    jurisdiction resolution against the approved-regulator registry and per-record source evidence.
    The per-country JSON at /api/regulatory/{slug} and /regulatory/data.json that llms.txt documents are
    closer matches but are NOT in the OpenAPI.
  confidence: medium
