  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '1.0'
  preferred_transport: JSONRPC
  transport: JSONRPC (supportedInterfaces[].protocolBinding)
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: true
  grade_basis: >-
    capabilities is an OBJECT (streaming, pushNotifications, stateTransitionHistory as boolean fields).
    protocolVersion is present, carried on supportedInterfaces[] as A2A 1.0.0 places it — the card declares
    BOTH "1.0" and "0.3.0" against the same JSONRPC endpoint, which is the dual-dialect posture its /a2a
    discovery document and manifest also state. skills is an ARRAY of seven fully-populated skills (id, name,
    description, tags, examples, inputModes, outputModes). All three optional discriminators are present:
    preferredTransport, defaultInputModes and defaultOutputModes.
  deviations:
  - field: protocolVersion
    observed: on supportedInterfaces[], not at the top level; no top-level url either
    note: >-
      A 0.3.0-only reader expecting top-level url/protocolVersion finds neither. The card is consistently
      1.0-shaped and additionally lists 0.3.0 in supportedInterfaces, so a 0.3.0 client is still told where
      to POST — but through the 1.0 field, which such a client may not read.
  - field: securitySchemes / securityRequirements / security
    observed: empty object, empty array, empty array
    note: Deliberate — the agent is anonymous and public; card.authentication says apiKeyRequired false.
  - field: mcp, contract, conformance, signing, authentication, policies, aiTransparency, sampleQuestions, agentCardUrl, lastUpdated
    observed: non-spec top-level extension fields
    note: >-
      Not A2A AgentCard fields. They are the most information-dense part of the card (MCP endpoint + tool
      names, contract and conformance URLs, Ed25519 answer-signing key) but a strict reader will drop them;
      A2A 1.0 would carry these under capabilities.extensions.
  - field: signatures
    observed: one AgentCardSignature (JWS, ES256) referencing /.well-known/jwks.json
    note: Present and verifiable against the published JWK; signatures vary between the canonical and alias projections by signing time.
