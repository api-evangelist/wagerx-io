    url: rate-limits/wagerx-io-rate-limits.yml
- name: Wagie MCP Server
  description: >-
    Remote, anonymous, stateless streamable-HTTP MCP server (protocol 2025-06-18) exposing 12 read-only
    tools over casino audit evidence, regulatory intelligence and the Agentic Gambling Index; tools/call
    results carry an Ed25519 SignedEvidenceEnvelope. Sibling servers run at /tech/mcp (9 tools, live),
    /agents/canada/mcp and /agents/anonymous/mcp.
  humanURL: https://wagerx.io/agent-gateway
  image: https://wagerx.io/static/images/wagerx-og-default.png
  baseURL: https://wagerx.io/mcp
  tags:
  - MCP
  - Agents
  properties:
  - type: MCPServer
    url: mcp/wagerx-io-mcp.yml
  - type: MCPServer
    url: https://wagerx.io/mcp
  - type: MCPServer
    url: https://wagerx.io/tech/mcp
  - type: ToolCrosswalk
    url: mcp/wagerx-io-tool-crosswalk.yml
  - type: Documentation
    url: https://wagerx.io/agent-gateway
- name: Wagie A2A Agent
  description: >-
    A2A JSON-RPC endpoint accepting A2A 1.0 SendMessage and 0.3.0 message/send for bounded iGaming and
    regulatory questions; discovered through a signed Agent Card at /.well-known/agent-card.json (graded
    conformant to A2A 1.0.0), with sibling cards for the Tech Concierge and the Canada and Anonymous
    casino agents.
  humanURL: https://wagerx.io/agent-gateway
  image: https://wagerx.io/static/images/wagerx-og-default.png
  baseURL: https://wagerx.io/a2a
  tags:
  - A2A
  - Agents
  properties:
  - type: AgentCard
    url: a2a/wagerx-io-a2a.yml
  - type: AgentCard
    url: https://wagerx.io/.well-known/agent-card.json
  - type: AgentCard
    url: https://wagerx.io/.well-known/tech-agent.json
  - type: Documentation
    url: https://wagerx.io/agent-gateway
