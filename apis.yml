apis:
- name: WagerX iGaming & Regulatory Intelligence API
  description: >-
    Public read-only REST feeds for dated crypto-casino audit evidence (all audits, one audit by slug),
    the regulatory intelligence alert feed, the Trump Crypto and Slot Hype indexes, latest news, and the
    agent discovery documents. No authentication; 30 requests/minute per IP; served from the apex domain.
  humanURL: https://wagerx.io/api
  image: https://wagerx.io/static/images/wagerx-og-default.png
  baseURL: https://wagerx.io
  tags:
  - Casino Audits
  - Regulatory Intelligence
  - Discovery
