- name: Wagie MCP Server
  description: >-
    Remote, anonymous, stateless streamable-HTTP MCP server (protocol 2025-06-18) exposing 12 read-only
    tools over casino audit evidence, regulatory intelligence and the Agentic Gambling Index; tools/call
    results carry an Ed25519 SignedEvidenceEnvelope. Sibling servers run at /tech/mcp (9 tools, live),
    /agents/canada/mcp and /agents/anonymous/mcp.
  humanURL: https://wagerx.io/agent-gateway
