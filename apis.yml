aid: wagerx-io
name: WagerX
description: >-
  WagerX is an independent crypto-casino audit lab and gambling regulatory intelligence publisher founded in
  2018 by Andreas Ericsson. It runs real-money deposit and withdrawal tests on 40+ crypto casinos, tracks
  enforcement actions from ~40 gambling regulators, and publishes the results as a free, anonymous,
  read-only API surface: a REST feed set described by an OpenAPI 3.1 document, the "Wagie" agent exposed
  over both A2A JSON-RPC and MCP streamable-HTTP with every answer wrapped in an Ed25519-signed evidence
  envelope, a separate "Tech Concierge" MCP/A2A agent, and an Agentic Gambling Index cataloguing other
  providers' MCP servers and A2A agents.
url: https://raw.githubusercontent.com/api-evangelist/wagerx-io/refs/heads/main/apis.yml
