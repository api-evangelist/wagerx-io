openapi: 3.2.0
info:
  title: Wagerx Io MCP API
  version: '2026-08-31'
  contact:
    name: WagerX
    url: https://wagerx.io
    email: info@wagerx.io
  license:
    name: Public Access
    url: https://wagerx.io/wagerx-ai-policy
  description: 'Operations tagged Mcp across 2 of this provider''s published API definitions: wagerx-io-openapi-original.json, wagerx-io-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://wagerx.io
  description: Production
tags:
- name: MCP
paths:
  /mcp:
    post:
      operationId: callWagieMCP
      summary: Initialize, list prompts, or call Wagie MCP tools
      description: Stateless streamable-HTTP MCP JSON-RPC endpoint. prompts/list and prompts/get expose ready-to-use questions. Successful tools/call responses include structuredContent matching SignedEvidenceEnvelope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              listNamedPrompts:
                summary: Discover named prompt templates
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: prompts/list
                  params: {}
              getCasinoSafetyPrompt:
                summary: Retrieve a named casino safety prompt
                value:
                  jsonrpc: '2.0'
                  id: 2
                  method: prompts/get
                  params:
                    name: casino_safety_check
                    arguments:
                      casino: Duelbits
              getAnonymousCasinosPrompt:
                summary: Retrieve the dated KYC evidence prompt
                value:
                  jsonrpc: '2.0'
                  id: 3
                  method: prompts/get
                  params:
                    name: best_anonymous_casinos
                    arguments: {}
              getCanadaCasinosPrompt:
                summary: Retrieve the Canada country-evidence prompt
                value:
                  jsonrpc: '2.0'
                  id: 4
                  method: prompts/get
                  params:
                    name: best_casinos_in_canada
                    arguments: {}
      responses:
        '200':
          description: MCP JSON-RPC response
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/MCPInitializeResponse'
                - $ref: '#/components/schemas/MCPPingResponse'
                - $ref: '#/components/schemas/MCPToolsListResponse'
                - $ref: '#/components/schemas/MCPResourcesListResponse'
                - $ref: '#/components/schemas/MCPResourceTemplatesListResponse'
                - $ref: '#/components/schemas/MCPPromptsListResponse'
                - $ref: '#/components/schemas/MCPPromptGetResponse'
                - $ref: '#/components/schemas/MCPSignedEvidenceResponse'
      x-rateLimit: 30 requests per minute per IP
      x-wagie-tools:
      - get_agentic_stats
      - find_agentic_services
      - check_casino
      - compare_casinos
      - latest_audits
      - list_casinos
      - top_casinos
      - new_casinos
      - long_running_casinos
      - best_bonuses
      - regulatory_intelligence
      - country_recommendations
      tags:
      - MCP
    servers:
    - url: https://wagerx.io
      description: Production
components:
  schemas:
    MCPResourceTemplatesListResponse:
      type: object
      required:
      - jsonrpc
      - id
      - result
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id: {}
        result:
          type: object
          required:
          - resourceTemplates
          properties:
            resourceTemplates:
              type: array
    MCPPromptGetResponse:
      type: object
      required:
      - jsonrpc
      - id
      - result
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id: {}
        result:
          type: object
          required:
          - description
          - messages
          properties:
            description:
              type: string
            messages:
              type: array
              minItems: 1
              items:
                type: object
                required:
                - role
                - content
                properties:
                  role:
                    type: string
                    const: user
                  content:
                    type: object
                    required:
                    - type
                    - text
                    properties:
                      type:
                        type: string
                        const: text
                      text:
                        type: string
    Evidence:
      type: object
      required:
      - evidence_id
      - source_name
      - source_url
      - authority
      - published_at
      - observed_at
      - retrieved_at
      - freshness
      - jurisdiction
      - evidence_type
      - limitations
      properties:
        evidence_id:
          type: string
        source_name:
          type: string
        source_url:
          type:
          - string
          - 'null'
          format: uri
        authority:
          type: string
        published_at:
          type:
          - string
          - 'null'
        observed_at:
          type:
          - string
          - 'null'
        retrieved_at:
          type: string
          format: date-time
        freshness:
          type: string
          enum:
          - current
          - aging
          - stale
          - unknown
        jurisdiction:
          type:
          - string
          - 'null'
        evidence_type:
          type: string
        limitations:
          type: array
          items:
            type: string
    AITransparency:
      type: object
      required:
      - schema_version
      - ai_interaction
      - provider
      - system
      - purposes
      - evidence_limitations
      - advice_boundary
      - human_contact
      - notice
      properties:
        schema_version:
          type: string
        ai_interaction:
          type: boolean
          const: true
        provider:
          type: object
          required:
          - name
          - url
        system:
          type: string
          const: Wagie
        purposes:
          type: array
          items:
            type: string
        evidence_limitations:
          type: string
        advice_boundary:
          type: string
        human_contact:
          type: object
          required:
          - email
          - policy_url
          - report_url
        notice:
          type: string
    MCPSignedEvidenceResponse:
      type: object
      required:
      - jsonrpc
      - id
      - result
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id: {}
        result:
          type: object
          required:
          - structuredContent
          properties:
            structuredContent:
              $ref: '#/components/schemas/SignedEvidenceEnvelope'
            content:
              type: array
              items:
                type: object
            isError:
              type: boolean
    EvidenceFirstData:
      type: object
      required:
      - schema_version
      - answer_id
      - agent_id
      - ai_transparency
      - evidence_state
      - claims
      - evidence
      properties:
        schema_version:
          type: string
          example: '2026-08-31'
        answer_id:
          type: string
        agent_id:
          type: string
          const: io.wagerx.wagie
        ai_transparency:
          $ref: '#/components/schemas/AITransparency'
        evidence_state:
          type: string
          enum:
          - available
          - stale
          - missing
          - unavailable
          - unaudited
          - insufficient_evidence
        claims:
          type: array
          items:
            $ref: '#/components/schemas/Claim'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
      additionalProperties: true
    MCPResourcesListResponse:
      type: object
      required:
      - jsonrpc
      - id
      - result
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id: {}
        result:
          type: object
          required:
          - resources
          properties:
            resources:
              type: array
    SignedEvidenceEnvelope:
      type: object
      required:
      - data
      - proof
      properties:
        data:
          $ref: '#/components/schemas/EvidenceFirstData'
        proof:
          type: object
          required:
          - type
          - key_id
          - public_key_url
          - signed_field
          - signature
          properties:
            type:
              type: string
              const: Ed25519Signature
            key_id:
              type: string
            public_key_url:
              type: string
              format: uri
            signed_field:
              type: string
              const: data
            signature:
              type: string
            signed_at:
              type: string
              format: date-time
    MCPPromptsListResponse:
      type: object
      required:
      - jsonrpc
      - id
      - result
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id: {}
        result:
          type: object
          required:
          - prompts
          properties:
            prompts:
              type: array
              items:
                type: object
                required:
                - name
                - description
                - arguments
                properties:
                  name:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  arguments:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      - description
                      - required
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        required:
                          type: boolean
    Claim:
      type: object
      required:
      - claim_id
      - claim
      - evidence_ids
      - state
      - limitations
      properties:
        claim_id:
          type: string
        claim:
          type: string
        evidence_ids:
          type: array
          items:
            type: string
        state:
          type: string
          enum:
          - available
          - stale
          - missing
          - unavailable
          - unaudited
          - insufficient_evidence
        limitations:
          type: array
          items:
            type: string
    MCPPingResponse:
      type: object
      required:
      - jsonrpc
      - id
      - result
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id: {}
        result:
          type: object
          maxProperties: 0
    MCPToolsListResponse:
      type: object
      required:
      - jsonrpc
      - id
      - result
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id: {}
        result:
          type: object
          required:
          - tools
          properties:
            tools:
              type: array
              items:
                type: object
                required:
                - name
                - description
                - inputSchema
    MCPInitializeResponse:
      type: object
      required:
      - jsonrpc
      - id
      - result
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id: {}
        result:
          type: object
          required:
          - protocolVersion
          - capabilities
          - serverInfo
          - instructions
          properties:
            protocolVersion:
              type: string
            capabilities:
              type: object
            serverInfo:
              type: object
              required:
              - name
              - title
              - version
            instructions:
              type: string
x-refined-from:
- wagerx-io-openapi-original.json
- wagerx-io-openapi.yml
