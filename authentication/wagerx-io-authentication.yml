method: searched
source: https://wagerx.io/agent-gateway
docs: https://wagerx.io/agent-gateway
spec_basis: openapi/wagerx-io-openapi.yml declares NO components.securitySchemes and no top-level security — derive-authentication.py therefore produced nothing; this profile is from the provider's docs and discovery documents.
summary: >-
  Entirely anonymous, read-only public access. The Agent Gateway states "No authentication. Rate limit: 30
  requests/minute per IP." and "FREE · NO API KEY"; the agent card declares authentication {publicEndpoints
  true, apiKeyRequired false} with empty securitySchemes/securityRequirements; the OpenAPI has no security
  schemes. The same holds for the MCP endpoints (/mcp, /tech/mcp, /agents/*/mcp — tools/list accepted
  without credentials, answering 200 or a 503 usage circuit, never 401) and the A2A endpoints.
schemes: []
auth_required: false
api_keys:
  issued: false
  signup: none
oauth2: false
oidc: false
mutual_tls: false
integrity:
  note: >-
    Authentication runs in the OTHER direction — the provider signs its answers so a client can verify
    WagerX origin: agent cards carry an ES256 JWS verifiable against https://wagerx.io/.well-known/jwks.json,
    and every A2A/MCP answer wraps data in an Ed25519-signed SignedEvidenceEnvelope verifiable against
    https://wagerx.io/.well-known/wagerx-signing.json (canonicalise data as JSON with sorted keys, compact
    separators, ASCII escaping; verify base64url proof.signature).
  answer_signing_key: https://wagerx.io/.well-known/wagerx-signing.json
  card_signing_jwks: https://wagerx.io/.well-known/jwks.json
abuse_controls:
  rate_limit: 30 requests/minute per IP (see rate-limits/wagerx-io-rate-limits.yml)
  usage_circuit: MCP endpoints return JSON-RPC -32001 / HTTP 503 when the provider's "automatic usage safety circuit" opens (observed 2026-09-19).
  robots: robots.txt explicitly Allows /openapi.json, /llms.txt, the agent cards and the /api/audit/, /api/regulatory-intel, /api/news/latest paths to all agents; Disallows /api/dashboard/, /api/pwa/, /api/kings-live-bets, /chat, /dashboard.
